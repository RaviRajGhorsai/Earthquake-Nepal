{% load static %}

<!DOCTYPE html>
<html>
<head>
    <title>Earthquake Map</title>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
    <link rel="stylesheet" href="{% static 'style/map_style.css' %}" />  
</head>


<body>
<div id="sidebar">
    <label for="year-select">Select Year:</label>
    <select id="year-select"></select>
    <button onclick="renderMap()">Show</button>
    <div id="info">
        <h2>Earthquake Information</h2>
        <p>Select a year to view earthquake data.</p>
    </div>
</div>
<div id="map"></div>

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
<script id="earthquake-data" type="application/json">
    {{ earthquake_data_json|safe }}
</script>
<script>
    let map;
    let Earthquake_data = {};
    let Current_markers = [];
    
    map = L.map('map').setView([28.3949, 84.1240], 6);
    //L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
    L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}').addTo(map);

    // Load Nepal boundary GeoJSON
    function loadNepalBoundary() {
        fetch('https://raw.githubusercontent.com/datasets/geo-countries/master/data/countries.geojson') // or use your own Nepal-only geojson
        .then(response => response.json())
        .then(data => {
        const nepalGeoJson = {
            type: "FeatureCollection",
            features: data.features.filter(f => f.properties.name === "Nepal")
        };
    
        L.geoJSON(nepalGeoJson, {
            style: {
            color: 'white',        // border color
            weight: 3,           // border thickness
            fill: false          // don't fill the country
            }
        }).addTo(map);
        });
    }
    loadNepalBoundary();

    fetch("{% static 'Earthquake years.json' %}")
    .then(res => res.json())
    .then(data => {
        Earthquake_data = data;
        const years = Object.keys(data).sort((a, b) => b - a);
        const select = document.getElementById('year-select');
        
        years.forEach(year => {
            const option = document.createElement('option');
            option.value = year;
            option.text = year;
            select.add(option);
        });
    });

    function renderMap(){
        const year = document.getElementById('year-select').value;
        const YearData = Earthquake_data[year];
        
        if (map) map.remove();

        map = L.map('map').setView([28.3949, 84.1240], 6);
        L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}').addTo(map);
        loadNepalBoundary();
        if (Array.isArray(YearData)){
            YearData.forEach(loc => {
                const Custom_marker = L.divIcon({
                    className: '',
                    html: `<div class='ripple_container'>
                    <div class='ripple'></div>
                    <div class='ripple'></div>
                    <div class='ripple'></div>
                    </div>`,
                    iconSize: [30, 30]
                });  
                const marker = L.marker([parseFloat(loc.Latitude), parseFloat(loc.Longitude)], {
                    icon: Custom_marker
                }).addTo(map);

                

                marker.bindPopup(`<strong>${loc.Epicenter}</strong><br>Magnitude: ${loc.Magnitude}`);
                Current_markers.push(marker);
            });
        }
        
        
    }
</script>
</body>
</html>
